<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D3B2C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>খরচের খাতা</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;700&family=Hind+Siliguri:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}

<style>
/* Layout: one phone column styled like a ruled khata. A dark ruled balance card on top, plain ledger rows below, bottom tab bar with a centre add button. */
:root{
  --bg:#EDF1EE; --surface:#FAFCFA; --ink:#14231C; --muted:#586A60; --line:#D3DCD6;
  --accent:#0E6B4E; --accent-ink:#FFFFFF; --exp:#B4341F; --sav:#2457A6; --warn:#8F5A00;
  --hero:#0D3B2C; --hero-ink:#EAF4EE; --hero-muted:#9CC3B2; --hero-line:rgba(255,255,255,.09);
  --danger-ink:#FFFFFF; --scrim:rgba(5,12,9,.55);
  --f-disp:'Anek Bangla','Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
  --f-body:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1512; --surface:#17211C; --ink:#E5EEE9; --muted:#8FA298; --line:#2A3830;
    --accent:#4DC09A; --accent-ink:#07241A; --exp:#F0907A; --sav:#86AEF2; --warn:#E5B04F;
    --hero:#14352A; --hero-ink:#E8F3ED; --hero-muted:#8DBBA8; --hero-line:rgba(255,255,255,.07);
    --danger-ink:#2A0E08; --scrim:rgba(0,0,0,.65); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#17211C; --ink:#E5EEE9; --muted:#8FA298; --line:#2A3830;
  --accent:#4DC09A; --accent-ink:#07241A; --exp:#F0907A; --sav:#86AEF2; --warn:#E5B04F;
  --hero:#14352A; --hero-ink:#E8F3ED; --hero-muted:#8DBBA8; --hero-line:rgba(255,255,255,.07);
  --danger-ink:#2A0E08; --scrim:rgba(0,0,0,.65); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.5;
  padding-block:8px 112px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-disp);margin:0;font-weight:700;text-wrap:balance}
.num{font-family:var(--f-disp);font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;min-height:48px}
.top h1{font-size:22px}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.icon-btn[aria-pressed=true]{background:var(--line)}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* month switcher */
.msw{display:flex;align-items:center;justify-content:space-between}
.msw b{font-family:var(--f-disp);font-size:18px;font-weight:700}

/* balance card */
.hero{
  background-color:var(--hero);color:var(--hero-ink);border-radius:14px;padding:18px 18px 4px;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--hero-line) 31px,var(--hero-line) 32px);
}
.hero .lbl{color:var(--hero-muted);font-size:14px}
.hero .big{font-size:40px;line-height:1.2;font-weight:700;margin:2px 0 14px;overflow-wrap:anywhere}
.hero .trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid var(--hero-line);padding:12px 0 14px}
.hero .trio small{display:block;color:var(--hero-muted);font-size:13px}
.hero .trio b{font-family:var(--f-disp);font-size:17px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

/* generic blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.cta{display:flex;align-items:center;justify-content:space-between;width:100%;color:var(--accent);font-weight:600}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h2{font-size:18px}
.link{color:var(--accent);font-weight:600;min-height:44px;padding:0 4px}
.muted{color:var(--muted)}
.small{font-size:14px}
.empty{padding:22px 8px;text-align:center;color:var(--muted)}

.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.bar.warn i{background:var(--warn)} .bar.bad i{background:var(--exp)}
.bmsg{margin:8px 0 0;font-size:14px}
.bmsg.warn{color:var(--warn)} .bmsg.bad{color:var(--exp)}

/* ledger rows */
.rows{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:12px 0;border-bottom:1px solid var(--line);min-height:56px}
.rows .row:last-child{border-bottom:0}
.row .mid{min-width:0;display:flex;flex-direction:column}
.row .mid b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .mid small{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.e{background:var(--exp)} .dot.i{background:var(--accent)} .dot.s{background:var(--sav)}
.amt{font-family:var(--f-disp);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.e{color:var(--exp)} .amt.i{color:var(--accent)} .amt.s{color:var(--sav)}
.day{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;padding:4px 2px 0}
.group{display:flex;flex-direction:column;gap:6px}

/* chips and segments */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px;min-height:40px;background:var(--bg);display:inline-flex;align-items:center}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--bg);gap:3px}
.seg-b{min-height:42px;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.seg-b[aria-pressed=true]{background:var(--ink);color:var(--bg);font-weight:600}
.seg-b.e::before,.seg-b.i::before,.seg-b.s::before{content:"";width:9px;height:9px;border-radius:50%}
.seg-b.e::before{background:var(--exp)} .seg-b.i::before{background:var(--accent)} .seg-b.s::before{background:var(--sav)}

/* report */
.cats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.cat-top{display:flex;justify-content:space-between;gap:12px;margin-bottom:5px}
.cat-top span:last-child{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.chart{position:relative;padding-top:20px}
.chart .mx{position:absolute;top:0;left:0;font-size:12px;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;border-top:1px dashed var(--line)}
.col{display:flex;flex-direction:column;align-items:center;gap:6px}
.pair{height:120px;display:flex;align-items:flex-end;gap:3px;border-bottom:1px solid var(--muted);width:100%;justify-content:center}
.pair i{display:block;width:34%;max-width:16px;border-radius:3px 3px 0 0}
.pair i.in{background:var(--accent)} .pair i.out{background:var(--exp)}
.col span{font-size:12px;color:var(--muted)} .col.cur span{color:var(--ink);font-weight:600}
.legend{display:flex;gap:16px;font-size:14px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stats small{display:block;color:var(--muted);font-size:13px}
.stats b{font-family:var(--f-disp);font-size:18px;overflow-wrap:anywhere}

/* savings */
.goal{display:flex;flex-direction:column;gap:10px}
.goal-h{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.goal-h b{font-size:17px}
.goal .bar i{background:var(--sav)}
.goal-a{display:flex;gap:8px;flex-wrap:wrap}

/* settings */
.set{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 14px}
.set-r{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:56px;border-bottom:1px solid var(--line);padding:8px 0}
.set .set-r:last-child{border-bottom:0}
.set-r .v{color:var(--muted);text-align:right}
.set-t{font-size:14px;color:var(--muted);margin:0 2px;font-weight:500}
.note{font-size:14px;color:var(--muted);margin:0}

/* buttons, inputs */
.btn{min-height:48px;border-radius:12px;padding:0 18px;background:var(--accent);color:var(--accent-ink);font-weight:600;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--exp);color:var(--danger-ink)}
.btn.small{min-height:40px;padding:0 14px}
.btn.block{width:100%}
input[type=text],input[type=date],input:not([type]),input[inputmode]{
  width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:0 14px;outline-offset:2px;font-size:16px;
}
.lab{display:block;margin:14px 0 6px;font-size:14px;color:var(--muted);font-weight:500}
.amt-in{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:0 14px}
.amt-in span{font-family:var(--f-disp);font-size:26px;color:var(--muted)}
.amt-in input{border:0;background:transparent;font-family:var(--f-disp);font-size:30px;font-weight:700;min-height:60px;padding:0;min-width:0}
.err{color:var(--exp);font-size:14px;margin:4px 0 0;min-height:0}
.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.actions .btn:first-child{flex:1 1 160px}

/* tab bar */
#nav{
  position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));
}
#nav .in{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));max-width:520px;margin:0 auto;align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;justify-content:center;color:var(--muted);font-size:12px}
.tab[aria-current=page]{color:var(--accent);font-weight:600}
.add{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:0 auto}
.add svg.ic{width:26px;height:26px}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:var(--scrim)}
.sheet{
  position:relative;width:100%;max-width:520px;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;
  padding-top:16px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  animation:up .18s ease-out;
}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sh-title{font-size:20px;margin-bottom:12px}

/* lock, splash, toast */
#lock,#splash{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#splash{z-index:70;color:var(--muted);font-family:var(--f-disp);font-size:18px}
.pad{width:100%;max-width:320px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.pad h2{font-size:22px}
.pad .sub{margin:0;min-height:24px;color:var(--muted);font-size:15px}
.dots{display:flex;gap:16px;margin:10px 0 14px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.keys{display:grid;grid-template-columns:repeat(3,76px);gap:12px;justify-content:center}
.key{width:76px;height:64px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-disp);font-size:24px;font-weight:700;display:grid;place-items:center;text-align:center}
.shake{animation:sh .3s}
@keyframes sh{20%{transform:translateX(-8px)}60%{transform:translateX(8px)}}
#toast{
  position:fixed;left:50%;transform:translateX(-50%);z-index:80;bottom:calc(84px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:15px;max-width:calc(100% - 32px);
  opacity:0;pointer-events:none;transition:opacity .2s;
}
#toast.on{opacity:1}
textarea{width:100%;min-height:140px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px;font-size:13px}
@media (prefers-reduced-motion: reduce){.sheet,.shake{animation:none}#toast{transition:none}}
</style>
</head>

</div>
<div id="lock" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="imp" accept=".json,application/json" hidden>

var S=blank();

function blank(){return {meta:{lang:'bn',pin:null,budget:0,cats:[],goals:[],u:0},months:{}}}
function normalize(o){
  var s=blank(); if(!o||typeof o!=='object') return s;
  if(o.meta&&typeof o.meta==='object'){
    var m=o.meta;
    s.meta.lang=m.lang==='en'?'en':'bn';
    s.meta.pin=(m.pin&&m.pin.h&&m.pin.s)?{h:String(m.pin.h),s:String(m.pin.s)}:null;
    s.meta.budget=isFinite(m.budget)&&m.budget>0?+m.budget:0;
    s.meta.cats=Array.isArray(m.cats)?m.cats.filter(function(c){return c&&c.k&&c.n&&(c.t==='e'||c.t==='i')}).map(function(c){return {k:String(c.k),n:String(c.n).slice(0,40),t:c.t}}):[];
    s.meta.goals=Array.isArray(m.goals)?m.goals.filter(function(g){return g&&g.id&&g.name}).map(function(g){return {id:String(g.id),name:String(g.name).slice(0,60),target:+g.target>0?+g.target:0}}):[];
    s.meta.u=+m.u||0;
  }
  if(o.months&&typeof o.months==='object'){
    Object.keys(o.months).forEach(function(k){
      if(!/^\d{4}-\d{2}$/.test(k)) return;
      var src=o.months[k]||{}; var tx=Array.isArray(src.tx)?src.tx:[];
      s.months[k]={u:+src.u||0,tx:[]};
      tx.forEach(function(x){
        if(!x||['e','i','s'].indexOf(x.t)<0||!(+x.a>0)||!/^\d{4}-\d{2}-\d{2}$/.test(x.d||'')) return;
        var mk=x.d.slice(0,7);
        if(!s.months[mk]) s.months[mk]={u:+src.u||0,tx:[]};
        s.months[mk].tx.push({id:String(x.id||uidGen()),t:x.t,a:+x.a,c:String(x.c||''),d:x.d,n:String(x.n||'').slice(0,120)});
      });
    });
  }
  return s;
}

/* ---------- helpers ---------- */
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function lang(){return S.meta.lang}
function t(k){var d=TX[lang()]||TX.bn;return d[k]!=null?d[k]:(TX.bn[k]!=null?TX.bn[k]:k)}
function f(k){var s=t(k),a=arguments;return s.replace(/\{(\d)\}/g,function(_,i){return a[+i+1]})}
function loc(){return lang()==='bn'?'bn-BD':'en-IN'}
function locDate(){return lang()==='bn'?'bn-BD':'en-GB'}
var nfCache={};
function nfmt(n){var k=loc();if(!nfCache[k])nfCache[k]=new Intl.NumberFormat(k,{maximumFractionDigits:2});return nfCache[k].format(n)}
function money(n){return (n<0?'−':'')+'৳'+nfmt(Math.abs(n))}
function D(s){s=String(s);return lang()==='bn'?s.replace(/\d/g,function(d){return BN_DIG[+d]}):s}
function pct(x){return D(Math.round(x*100))+'%'}
function parseAmt(s){
  s=String(s||'').replace(/[০-৯]/g,function(c){return String(BN_DIG.indexOf(c))}).replace(/[,\s৳]/g,'');
  var n=parseFloat(s); return isFinite(n)?Math.round(n*100)/100:NaN;
}
function pad2(n){return (n<10?'0':'')+n}
function today(){var d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function curMonth(){return today().slice(0,7)}
function shiftMonth(k,n){var y=+k.slice(0,4),m=+k.slice(5,7)-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+pad2(m+1)}
function monthLabel(k){return new Intl.DateTimeFormat(locDate(),{month:'long',year:'numeric'}).format(new Date(+k.slice(0,4),+k.slice(5,7)-1,1))}
function shortMonth(k){return new Intl.DateTimeFormat(locDate(),{month:'short'}).format(new Date(+k.slice(0,4),+k.slice(5,7)-1,1))}
function fmtDay(d){return new Intl.DateTimeFormat(locDate(),{weekday:'short',day:'numeric',month:'short'}).format(new Date(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10)))}
function daysIn(k){return new Date(+k.slice(0,4),+k.slice(5,7),0).getDate()}
function uidGen(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function ic(n){
  var p={
    home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
    list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',

    save:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
    set:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
    'chev-l':'<path d="M15 6l-6 6 6 6"/>','chev-r':'<path d="M9 6l6 6-6 6"/>',
    back:'<path d="M20 5H9l-6 7 6 7h11a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9.5l-5 5M12 9.5l5 5"/>'
  }[n]||'';
  return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+p+'</svg>';
}

/* ---------- data access ---------- */
function monthTx(mk){return (S.months[mk]&&S.months[mk].tx)||[]}
function totals(mk){var r={i:0,e:0,s:0,cat:{}};monthTx(mk).forEach(function(x){r[x.t]+=x.a;if(x.t==='e')r.cat[x.c]=(r.cat[x.c]||0)+x.a});return r}
function allSaved(){var tot=0,by={};Object.keys(S.months).forEach(function(mk){S.months[mk].tx.forEach(function(x){if(x.t==='s'){tot+=x.a;by[x.c||'']=(by[x.c||'']||0)+x.a}})});return {tot:tot,by:by}}
function catList(type){
  var out=DEF[type].map(function(d){return {k:d[0],n:lang()==='bn'?d[1]:d[2]}});
  S.meta.cats.forEach(function(c){if(c.t===type)out.push({k:c.k,n:c.n})});
  return out;
}
function catName(type,key){
  var l=catList(type==='i'?'i':'e');
  for(var i=0;i<l.length;i++) if(l[i].k===key) return l[i].n;
  return t('otherCat');
}
function txLabel(x){
  if(x.t==='s'){
    if(!x.c) return t('generalSave');
    var g=S.meta.goals.filter(function(g){return g.id===x.c})[0];
    return g?g.name:t('generalSave');
  }
  return catName(x.t,x.c);
}
function touchMeta(){S.meta.u=Date.now();dirty.meta=true;persist()}
function touchMonth(mk){if(!S.months[mk])S.months[mk]={tx:[],u:0};S.months[mk].u=Date.now();dirty[mk]=true}
function addTx(x){var mk=x.d.slice(0,7);touchMonth(mk);S.months[mk].tx.push(x);persist()}
function removeTx(id,mk,quiet){
  var m=S.months[mk];if(!m)return;
  m.tx=m.tx.filter(function(x){return x.id!==id});
  touchMonth(mk);if(!quiet)persist();
}
function findTx(id,mk){return monthTx(mk).filter(function(x){return x.id===id})[0]}

/* ---------- storage ---------- */
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function loadLocal(){try{var r=localStorage.getItem(LS);if(r)return JSON.parse(r)}catch(e){}return null}
function persist(){saveLocal();scheduleFlush()}
function scheduleFlush(){if(!db)return;clearTimeout(flushTimer);flushTimer=setTimeout(flush,700)}
async function flush(){
  if(!db||flushing)return; flushing=true;
  var keys=Object.keys(dirty),failed=false;
  for(var i=0;i<keys.length;i++){
    var k=keys[i]; delete dirty[k];
    try{
      if(k==='meta') await db.doc('data/users/'+uid+'/meta').set(JSON.parse(JSON.stringify(S.meta)));
      else{var m=S.months[k]; if(m) await db.doc('data/users/'+uid+'/m'+k.replace('-','')).set({tx:JSON.parse(JSON.stringify(m.tx)),u:m.u})}
    }catch(e){dirty[k]=true;failed=true;break}
  }
  ui.sync=failed?'error':'cloud'; flushing=false;
  if(failed) setTimeout(scheduleFlush,15000); else if(Object.keys(dirty).length) scheduleFlush();
  if(ui.tab==='settings'&&!ui.locked&&!$('#sheet').hidden===false) render();
}

  var sign=x.t==='i'?'+':x.t==='e'?'−':'';
  return '<button class="row" data-a="edit" data-id="'+esc(x.id)+'" data-m="'+mk+'"><span class="dot '+x.t+'"></span><span class="mid"><b>'+esc(txLabel(x))+'</b>'+(x.n?'<small>'+esc(x.n)+'</small>':'')+'</span><span class="amt '+x.t+'">'+sign+money(x.a)+'</span></button>';

function sortedTx(mk){return monthTx(mk).map(function(x,i){return {x:x,i:i}}).sort(function(a,b){return a.x.d<b.x.d?1:a.x.d>b.x.d?-1:b.i-a.i}).map(function(o){return o.x})}

function budgetHtml(T){
  var b=S.meta.budget;
  if(!b) return '<button class="card cta" data-a="budget"><span>'+esc(t('setBudgetCta'))+'</span>'+ic('chev-r')+'</button>';
  var p=T.e/b, cls=p>=1?'bad':p>=0.8?'warn':'';
  var msg=p>=1?f('overBudget',money(T.e-b)):p>=0.8?f('nearBudget',pct(p)):f('budgetUsed',pct(p),money(b-T.e));
  var extra='';
  if(ui.month===curMonth()&&b>T.e){
    var left=daysIn(ui.month)-(+today().slice(8,10))+1;
    if(left>0) extra='<p class="note" style="margin-top:6px">'+esc(f('perDay',money((b-T.e)/left)))+'</p>';
  }
  return '<div class="card"><div class="sec-h" style="margin-bottom:10px"><b>'+esc(t('budget'))+'</b><button class="link" data-a="budget" style="min-height:0">'+money(b)+'</button></div>'
    +'<div class="bar '+cls+'" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Math.min(100,Math.round(p*100))+'"><i style="width:'+Math.min(100,p*100)+'%"></i></div>'
    +'<p class="bmsg '+cls+'">'+esc(msg)+'</p>'+extra+'</div>';
}

function vReport(){
  var mk=ui.month,T=totals(mk);
  var h=monthSwitch();
  var cats=Object.keys(T.cat).map(function(k){return {k:k,v:T.cat[k]}}).sort(function(a,b){return b.v-a.v});
  h+='<section class="card"><div class="sec-h" style="margin-bottom:14px"><h2>'+esc(t('spentWhere'))+'</h2><b class="num">'+money(T.e)+'</b></div>';
  if(!cats.length) h+='<p class="muted" style="margin:0">'+esc(t('noExp'))+'</p>';
  else h+='<ul class="cats">'+cats.map(function(c){
    var p=c.v/T.e;
    return '<li><div class="cat-top"><span>'+esc(catName('e',c.k))+'</span><span>'+money(c.v)+' · '+pct(p)+'</span></div><div class="bar"><i style="width:'+Math.max(2,p*100)+'%"></i></div></li>';
  }).join('')+'</ul>';
  h+='</section>';
  var months=[];for(var i=5;i>=0;i--)months.push(shiftMonth(mk,-i));

/* ---------- PIN ---------- */
async function hashPin(pin,salt){
  try{
    var b=new TextEncoder().encode(salt+':'+pin),h=await crypto.subtle.digest('SHA-256',b);
    return Array.from(new Uint8Array(h)).map(function(x){return (x<16?'0':'')+x.toString(16)}).join('');
  }catch(e){var s=salt+':'+pin,r=5381;for(var i=0;i<s.length;i++)r=((r<<5)+r+s.charCodeAt(i))|0;return 'x'+r}
}
async function verifyPin(p){return S.meta.pin?(await hashPin(p,S.meta.pin.s))===S.meta.pin.h:true}
function mountPad(root,opts){
  var buf='',busy=false;
  function draw(msg,shake){
    root.innerHTML='<div class="pad"><h2>'+esc(opts.title)+'</h2><p class="sub" role="alert">'+esc(msg||opts.sub||'')+'</p>'
      +'<div class="dots'+(shake?' shake':'')+'" aria-hidden="true">'+[0,1,2,3].map(function(i){return '<i class="'+(i<buf.length?'on':'')+'"></i>'}).join('')+'</div>'
      +'<div class="keys">'+['1','2','3','4','5','6','7','8','9','','0','<'].map(function(k){
        return k===''?'<span></span>':'<button type="button" class="key" data-k="'+k+'" aria-label="'+esc(k==='<'?t('back'):k)+'">'+(k==='<'?ic('back'):D(k))+'</button>';
      }).join('')+'</div>'+(opts.cancel?'<button class="link" data-a="close">'+esc(t('cancel'))+'</button>':'')+'</div>';
  }
  root.onclick=function(e){
    var b=e.target.closest('[data-k]');if(!b||busy)return;
    var k=b.getAttribute('data-k');
    if(k==='<')buf=buf.slice(0,-1);else if(buf.length<4)buf+=k;
    draw();
    if(buf.length===4){
      busy=true;var pin=buf;
      setTimeout(async function(){
        var err; try{err=await opts.onDone(pin,ctrl)}catch(x){err=''}
        buf='';busy=false;draw(err||null,!!err);
      },140);
    }
  };
  var ctrl={set:function(title,sub){opts.title=title;opts.sub=sub;buf='';draw()}};
  draw();return ctrl;
}
function lockApp(){
  if(!S.meta.pin)return;
  ui.locked=true;closeSheet();
  $('#app').hidden=true;$('#nav').hidden=true;$('#splash').hidden=true;
  var el=$('#lock');el.hidden=false;
  mountPad(el,{title:t('enterPin'),sub:t('pin4'),onDone:async function(p){
    var now=Date.now();
    if(now<lockUntil) return f('tryLater',D(Math.ceil((lockUntil-now)/1000)));
    if(await verifyPin(p)){failCount=0;unlockApp();return}
    failCount++;
    if(failCount>=5){failCount=0;lockUntil=Date.now()+30000;return f('tryLater',D(30))}
    return t('wrongPin');
  }});
}
function unlockApp(){
  ui.locked=false;$('#lock').hidden=true;$('#lock').innerHTML='';
  $('#app').hidden=false;$('#nav').hidden=false;render();
}

    if(p!==first){first=null;c.set(t('newPin'),t('pin4'));return t('pinMismatch')}
    var salt=uidGen();S.meta.pin={s:salt,h:await hashPin(p,salt)};touchMeta();

function pinCheckThen(next){

function replaceAll(ns,keepPin){
  var now=Date.now(),old=Object.keys(S.months),pin=S.meta.pin,ln=S.meta.lang;
  var nm={};old.forEach(function(k){nm[k]={tx:[],u:now}});
  Object.keys(ns.months).forEach(function(k){nm[k]={tx:ns.months[k].tx,u:now}});
  S={meta:ns.meta,months:nm};
  S.meta.pin=keepPin?pin:S.meta.pin;S.meta.u=now;

  var cat=form.t==='s'?(form.c==='_'?'':form.c):form.c;
  var d=/^\d{4}-\d{2}-\d{2}$/.test(form.d)?form.d:today();
  var tx={id:form.id||uidGen(),t:form.t,a:a,c:cat,d:d,n:(form.n||'').trim().slice(0,120)};

  addTx(tx);
  if(d.slice(0,7)!==ui.month&&form.mode==='add')ui.month=d.slice(0,7);
  closeSheet();toast(t('saved'));render();
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;
  act(el.getAttribute('data-a'),el);
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
$('#imp').addEventListener('change',function(){
  var file=this.files&&this.files[0];if(!file)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(String(r.result));
      if(!o||typeof o!=='object'||!o.months||!o.meta)throw new Error('bad');
      var ns=normalize(o);pendingImport=ns;
      openSheet('<h2 class="sh-title">'+esc(f('importAsk',D(countTx(ns))))+'</h2><div class="actions"><button class="btn danger" data-a="importYes">'+esc(t('importYes'))+'</button><button class="btn ghost" data-a="close">'+esc(t('cancel'))+'</button></div>');
    }catch(e){toast(t('badFile'))}
  };
  r.onerror=function(){toast(t('badFile'))};
  r.readAsText(file);
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden){hiddenAt=Date.now()}
  else if(S.meta.pin&&!ui.locked&&hiddenAt&&Date.now()-hiddenAt>60000){lockApp()}
});
document.addEventListener('input',function(e){
  if(e.target.id==='f-amt')$('#e-amt').textContent='';
});

/* ---------- boot ---------- */
function start(){
  if(ui.started)return; ui.started=true;
  $('#splash').hidden=true;
  if(S.meta.pin){lockApp();return}
  $('#app').hidden=false;$('#nav').hidden=false;render();
}
(function boot(){
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')}catch(e){}
  var l=loadLocal();hadLocal=!!l;
  if(l)S=normalize(l);
  document.documentElement.lang=lang();
  var rp=initRemote();
  if(hadLocal)start();
  else Promise.race([rp,new Promise(function(r){setTimeout(r,3500)})]).then(start);
})();
})();
</script>

</body>
</html>
